[project]
name = "field-kit"
version = "0.1.0"
description = "Tools for generating and analyzing Gaussian random fields and their power spectra on regular grids"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.62.1",
    "numpy>=2.3.3",
    "scipy>=1.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["field_kit"]

[dependency-groups]
docs = [
    "ipykernel>=7.1.0",
    "h5py>=3.15.1",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "pooch>=1.9.0",
    "yt>=4.4.2",
    "sphinx>=7.4.0",
    "myst-nb>=1.1.0",
    "pydata-sphinx-theme>=0.16.0",
    "sphinx-copybutton>=0.5.2",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
